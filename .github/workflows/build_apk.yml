name: Build Nabd Telecom APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project and Organize Files
        run: |
          mkdir -p lib/screens lib/core
          [ -f "main.dart" ] && cp -f main.dart lib/
          [ -f "dashboard_screen.dart" ] && cp -f dashboard_screen.dart lib/screens/ && cp -f dashboard_screen.dart lib/
          [ -f "api_service.dart" ] && cp -f api_service.dart lib/core/ && cp -f api_service.dart lib/
          flutter create . --platforms=android --org com.nabd.telecom
          [ -f "main.dart" ] && cp -f main.dart lib/
          [ -f "dashboard_screen.dart" ] && cp -f dashboard_screen.dart lib/screens/

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nabd-Telecom-App
          path: build/app/outputs/flutter-apk/app-release.apk
